name: Public plugin quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin/package-lock.json
      - run: npm ci
      - run: npm --prefix plugin ci
      - run: npm audit --omit=dev
      - run: npm --prefix plugin audit --omit=dev
      - run: npm run check:release
